name: ORBIT07 - Premarket Gate (07:20/07:30/07:40 TPE)

on:
  schedule:
    # GitHub cron is UTC. Retry around the 07:30 TPE navigation window.
    - cron: '20,30,40 23 * * 0-4'   # UTC Sun-Thu 23:20/23:30/23:40 = TPE Mon-Fri 07:20/07:30/07:40
  workflow_dispatch: {}

concurrency:
  group: orbit07-premarket
  cancel-in-progress: false

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /cron/premarket
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CRON_KEY:  ${{ secrets.CRON_KEY }}
        run: |
          set -euo pipefail
          BASE="${BASE_URL%/}"
          curl -fsS --retry 3 --retry-delay 5 --max-time 25 \
            -H "Content-Type: application/json" \
            -H "X-Cron-Key: $CRON_KEY" \
            -X POST "$BASE/cron/premarket" -d '{}'
